# unbound — резолвер ДМЗ.
server:
    verbosity: 1
    interface: 0.0.0.0
    port: 53
    do-daemonize: no
    username: ""
    use-syslog: no
    logfile: ""
    access-control: 10.0.0.0/8 allow
    access-control: 172.20.20.0/24 allow
    access-control: 127.0.0.0/8 allow

# Прямая зона домена — на FreeIPA
forward-zone:
    name: "otlichnik.lab"
    forward-addr: 10.10.20.10

# Обратные зоны — тоже на FreeIPA
forward-zone:
    name: "10.10.10.in-addr.arpa"
    forward-addr: 10.10.20.10
forward-zone:
    name: "20.10.10.in-addr.arpa"
    forward-addr: 10.10.20.10

# Все прочие имена — на внешний DNS (ext-dns) через fw1.
# Контур замкнут: рекурсии наружу через mgmt нет.
forward-zone:
    name: "."
    forward-addr: 198.51.100.53
