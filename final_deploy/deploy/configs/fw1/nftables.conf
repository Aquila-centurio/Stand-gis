#!/usr/sbin/nft -f
# fw1 — внешний МЭ. ЭТАП 2: маршрутизация + NAT.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy accept;
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        # Возвратный трафик уже разрешённых сессий
        ct state established,related accept

        # ДМЗ -> внешняя сеть (адреса прячутся за WAN-адресом fw1, см. таблицу nat)
        iifname "eth2" oifname "eth1" accept

        # Публичный WEB в ДМЗ: доступ из внешней сети только на 80/443
        iifname "eth1" oifname "eth2" ip daddr 10.10.10.11 tcp dport { 80, 443 } accept

        # VPN в ДМЗ: удалённый доступ из внешней сети (OpenVPN)
        iifname "eth1" oifname "eth2" ip daddr 10.10.10.14 udp dport 1194 accept

        # Всё остальное в forward дропается политикой.
        # Логируем с ограничением частоты — для наглядности.
        limit rate 5/minute log group 1 prefix "fw1-fwd-drop "
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}

# NAT: выход сервисов ДМЗ во внешнюю сеть
table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname "eth1" masquerade
    }
}
