#!/usr/sbin/nft -f
# Captive-портал: перехват, авторизация, NAT.
flush ruleset

table inet gis_portal {
    # IP авторизованных клиентов (с таймаутом сессии)
    set authorized {
        type ipv4_addr
        flags timeout
    }

    # HTTP неавторизованных клиентов -> на страницу входа портала.
    # Портал запоминает исходный URL и после успешного входа отвечает 302
    # обратно на него (см. portal.py). После авторизации IP клиента попадает
    # в набор authorized, и это правило для него больше не срабатывает.
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        iifname "eth1" ip saddr 10.10.20.0/24 ip saddr != @authorized \
            tcp dport 80 counter redirect to :80
    }

    # Транзит: по умолчанию запрещён
    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        # DNS клиентам всегда (чтобы резолвили и попадали на портал)
        iifname "eth1" ip saddr 10.10.20.0/24 ip daddr 10.10.10.10 udp dport 53 accept
        iifname "eth1" ip saddr 10.10.20.0/24 ip daddr 10.10.10.10 tcp dport 53 accept
        # авторизованные клиенты — наружу
        iifname "eth1" ip saddr @authorized accept
    }

    # NAT авторизованного/разрешённого транзита
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname "eth1" ip saddr 10.10.20.0/24 masquerade
    }

    chain input {
        type filter hook input priority filter; policy accept;
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
}
