#!/usr/sbin/nft -f
# fw2 — внутренний МЭ. ЭТАП 2-3: маршрутизация + DNS-форвард в DC.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy accept;
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        # Возвратный трафик уже разрешённых сессий
        ct state established,related accept

        # Приватная сеть -> ДМЗ (DNS, RADIUS, сервисы).
        # Инициировать соединения из ДМЗ в приватную сеть нельзя.
        iifname "eth2" oifname "eth1" accept

        # Исключение: резолвер ДМЗ -> FreeIPA (мастер-зона otlichnik.lab).
        # Разрешены DNS и LDAP (RADIUS-бэкенд).
        iifname "eth1" oifname "eth2" ip daddr 10.10.20.10 udp dport 53 accept
        iifname "eth1" oifname "eth2" ip daddr 10.10.20.10 tcp dport { 53, 389, 636 } accept

        # VPN-доступ во внутреннюю сеть (после авторизации на VPN; vpn NAT-ит в 10.10.10.14)
        iifname "eth1" oifname "eth2" ip saddr 10.10.10.14 accept

        # Приватная сеть -> внешняя сеть НЕ разрешена.
        # Доступ в интернет — только после авторизации в RADIUS (этап 6).

        limit rate 5/minute log group 1 prefix "fw2-fwd-drop "
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
