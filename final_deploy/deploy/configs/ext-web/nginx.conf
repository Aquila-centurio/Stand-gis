# ext-web — имитация внешнего сайта.
# Отдаёт одну и ту же страницу на любой Host и любой путь: так после
# авторизации на портале открывается именно тот URL, который ввёл
# пользователь (включая пути вроде /news/2026).
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Проверки captive-portal detection. До авторизации портал перехватывает
    # их и отправляет браузер на страницу входа; после авторизации эти ответы
    # говорят браузеру «интернет есть», и он не показывает портал снова.
    location = /generate_204 { return 204; }
    location = /gen_204 { return 204; }
    location = /success.txt {
        default_type text/plain;
        return 200 "success";
    }
    location = /connecttest.txt {
        default_type text/plain;
        return 200 "Microsoft Connect Test";
    }
    location = /ncsi.txt {
        default_type text/plain;
        return 200 "Microsoft NCSI";
    }
    location = /check_network_status.txt {
        default_type text/plain;
        return 200 "NetworkManager is online";
    }
    location = /hotspot-detect.html {
        default_type text/html;
        return 200 "<HTML><HEAD><TITLE>Success</TITLE></HEAD><BODY>Success</BODY></HTML>";
    }
    location = /library/test/success.html {
        default_type text/html;
        return 200 "<HTML><HEAD><TITLE>Success</TITLE></HEAD><BODY>Success</BODY></HTML>";
    }
    location = /canonical.html {
        default_type text/html;
        return 200 "Success";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}