# RADIUS-клиенты (NAS), которым разрешено слать запросы.
# require_message_authenticator = no — разрешаем простые клиенты (radclient
# без Message-Authenticator). В учебной лабе допустимо.
client localhost {
	ipaddr = 127.0.0.1
	secret = testing123
	require_message_authenticator = no
}

# Приватная сеть (АРМ) и ДМЗ — для тестов и доступа в интернет
client internal {
	ipaddr = 10.10.20.0/24
	secret = testing123
	require_message_authenticator = no
}

client dmz {
	ipaddr = 10.10.10.0/24
	secret = testing123
	require_message_authenticator = no
}
