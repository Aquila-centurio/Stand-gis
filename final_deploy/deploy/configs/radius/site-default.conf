# Минимальный site: PAP -> поиск в LDAP -> bind-as-user.
server default {
	listen {
		type = auth
		ipaddr = *
		port = 0
	}
	listen {
		type = acct
		ipaddr = *
		port = 0
	}

	authorize {
		preprocess
		chap
		mschap
		ldap
		if ((ok || updated) && User-Password) {
			update control {
				&Auth-Type := LDAP
			}
		}
	}

	authenticate {
		Auth-Type PAP {
			pap
		}
		Auth-Type LDAP {
			ldap
		}
	}

	preacct {
		preprocess
	}

	accounting {
	}

	post-auth {
	}

	pre-proxy {
	}

	post-proxy {
	}
}
